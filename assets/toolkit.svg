      <text x="68" y="534">Jenkins</text>
      <text x="449" y="476">PostgreSQL / Oracle</text>
      <text x="449" y="505">MySQL / SQL Server</text>
      <text x="449" y="534">Data mapping + transformation</text>
      <text x="830" y="476">Splunk / Postman</text>
      <text x="830" y="505">Jira / Confluence</text>
      <text x="830" y="534">Studio / Anypoint Code Builder</text>
    </g>
  </g>
  <g fill="none" stroke="#A6EAF4" stroke-opacity=".65" stroke-width="1.2">
    <rect class="toolkit-trace" pathLength="100" x="44" y="130" width="350" height="205" rx="14"/>
    <rect class="toolkit-trace" pathLength="100" x="425" y="130" width="350" height="205" rx="14" style="animation-delay:-4s"/>
    <rect class="toolkit-trace" pathLength="100" x="806" y="130" width="350" height="205" rx="14" style="animation-delay:-8s"/>
    <rect class="toolkit-trace" pathLength="100" x="44" y="355" width="350" height="220" rx="14" style="animation-delay:-6s"/>
    <rect class="toolkit-trace" pathLength="100" x="425" y="355" width="350" height="220" rx="14" style="animation-delay:-10s"/>
    <rect class="toolkit-trace" pathLength="100" x="806" y="355" width="350" height="220" rx="14" style="animation-delay:-2s"/>
