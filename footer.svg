<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Niranjan. Connecting systems. Enabling teams.</title>
  <defs>
    <linearGradient id="footer-bg" x2="0" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#0B2033"/></linearGradient>
    <radialGradient id="footer-glow" cx="50%" cy="100%" r="70%"><stop stop-color="#087F9C" stop-opacity=".7"/><stop offset="1" stop-color="#124052" stop-opacity="0"/></radialGradient>
    <linearGradient id="footer-rule" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0"><stop stop-color="#087F9C" stop-opacity="0"/><stop offset=".5" stop-color="#53CADD"/><stop offset="1" stop-color="#087F9C" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sig-name { font-family: Georgia, "Palatino Linotype", serif; font-style: italic; stroke: #A6EAF4; stroke-width: 1; fill: #A6EAF4; fill-opacity: 1; stroke-dasharray: 900; stroke-dashoffset: 0; animation: sig-write 3.6s cubic-bezier(.65,0,.35,1) .3s forwards; }
    .sig-rule { stroke-dasharray: 1000; stroke-dashoffset: 0; animation: sig-draw 2.4s cubic-bezier(.65,0,.35,1) 1.6s forwards; }
    .sig-flow { stroke-dasharray: 4 96; animation: sig-flow 8s linear infinite; }
    @keyframes sig-write { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    @keyframes sig-draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes sig-flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sig-name { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
      .sig-rule { animation: none; stroke-dashoffset: 0; }
      .sig-in, .sig-flow { animation: none; }
    }
  </style>
  <rect width="1200" height="230" rx="20" fill="url(#footer-bg)"/>
  <rect width="1200" height="230" rx="20" fill="url(#footer-glow)"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="19.5" fill="none" stroke="#53CADD" stroke-opacity=".2"/>
  <text class="sig-name" x="600" y="118" text-anchor="middle" font-size="84">Niranjan</text>
  <path class="sig-rule" d="M100 146H1100" stroke="url(#footer-rule)" stroke-width="1"/>
  <g class="sig-in" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="182" fill="#ADC6D6" font-size="13" letter-spacing="3">CONNECTING SYSTEMS / ENABLING TEAMS</text>
  </g>
  <g fill="none" stroke="#A6EAF4" stroke-width="2" stroke-linecap="round">
    <path class="sig-flow" pathLength="100" d="M60 206H1140"/>
  </g>
</svg>
