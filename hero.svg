<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Niranjan Kumar Potter | Senior MuleSoft Developer and Technical Lead</title>
  <desc id="hero-desc">An animated integration diagram carries light between APIs, MuleSoft, cloud,
    and data systems. Burgundy and rose design with steady text and a reduced-motion alternative.
    The diagram is decorative, not a live system monitor.</desc>
  <defs>
    <linearGradient id="hero-background" x2="1" y2="1">
      <stop stop-color="#10070C"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="hero-aura">
      <stop stop-color="#AE426D" stop-opacity=".38"/>
      <stop offset="1" stop-color="#AE426D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-accent" gradientUnits="userSpaceOnUse" x1="64" y1="247" x2="590" y2="247">
      <stop stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="hero-core" x2="1" y2="1">
      <stop stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#C77B9B" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="hero-frame"><rect width="1200" height="500" rx="24"/></clipPath>
    <filter id="hero-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .hero-orbit { transform-origin: 948px 241px; animation: hero-rotate 36s linear infinite; }
    .hero-orbit-back { animation-direction: reverse; animation-duration: 54s; }
    .hero-packet { stroke-dasharray: 5 95; animation: hero-flow 5s linear infinite; }
    .hero-packet-late { animation-delay: -2.5s; }
    .hero-aura { animation: hero-breathe 9s ease-in-out infinite; }
    .hero-sheen { animation: hero-sweep 8s ease-in-out infinite; }
    @keyframes hero-rotate { to { transform: rotate(360deg); } }
    @keyframes hero-flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes hero-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes hero-sweep {
      0%, 12% { transform: translateX(0); opacity: 0; }
      22% { opacity: .9; }
      72% { opacity: .9; }
      85%, 100% { transform: translateX(455px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-orbit, .hero-packet, .hero-aura, .hero-sheen { animation: none; }
      .hero-sheen { display: none; }
    }
  </style>
  <g clip-path="url(#hero-frame)">
    <rect width="1200" height="500" fill="url(#hero-background)"/>
    <rect width="1200" height="500" fill="url(#hero-grid)"/>
    <ellipse class="hero-aura" cx="960" cy="240" rx="330" ry="305" fill="url(#hero-aura)"/>
    <path d="M64 420H1136" stroke="#C77B9B" stroke-opacity=".22"/>
    <g fill="none" stroke="#C77B9B">
      <circle cx="948" cy="241" r="175" stroke-opacity=".15"/>
      <circle class="hero-orbit" cx="948" cy="241" r="159" stroke-dasharray="1 15" stroke-opacity=".5"/>
      <g class="hero-orbit hero-orbit-back">
        <circle cx="948" cy="241" r="130" stroke-dasharray="55 150 16 110" stroke-opacity=".45"/>
        <circle cx="1078" cy="241" r="4" fill="#E5B5C7" stroke="none"/>
      </g>
    </g>
    <g fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-width="1.5">
      <path d="M826 134H868Q888 134 888 154V221Q888 241 908 241"/>
      <path d="M826 348H868Q888 348 888 328V261Q888 241 908 241"/>
      <path d="M988 241H1008Q1028 241 1028 221V154Q1028 134 1048 134H1110"/>
      <path d="M988 241H1008Q1028 241 1028 261V328Q1028 348 1048 348H1110"/>
    </g>
    <g fill="none" stroke="#F8F0F3" stroke-width="3" stroke-linecap="round">
      <path class="hero-packet" pathLength="100" d="M826 134H868Q888 134 888 154V221Q888 241 908 241"/>
      <path class="hero-packet hero-packet-late" pathLength="100" d="M826 348H868Q888 348 888 328V261Q888 241 908 241"/>
      <path class="hero-packet hero-packet-late" pathLength="100" d="M988 241H1008Q1028 241 1028 221V154Q1028 134 1048 134H1110"/>
      <path class="hero-packet" pathLength="100" d="M988 241H1008Q1028 241 1028 261V328Q1028 348 1048 348H1110"/>
    </g>
    <circle cx="948" cy="241" r="60" fill="url(#hero-core)" stroke="#C77B9B"/>
    <circle cx="948" cy="241" r="68" fill="none" stroke="#E5B5C7" stroke-opacity=".12" stroke-width="6"/>
    <g fill="#190B12" stroke="#C77B9B" stroke-opacity=".6">
      <rect x="778" y="112" width="100" height="44" rx="10"/>
      <rect x="778" y="326" width="100" height="44" rx="10"/>
      <rect x="1050" y="112" width="100" height="44" rx="10"/>
      <rect x="1050" y="326" width="100" height="44" rx="10"/>
    </g>
    <g fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <text x="948" y="238" font-size="21" font-weight="700">MULE</text>
      <text x="948" y="259" font-size="12" letter-spacing="2">CONNECT</text>
      <g font-size="14" font-weight="600">
        <text x="828" y="139">APIs</text>
        <text x="828" y="353">EVENTS</text>
        <text x="1100" y="139">CLOUD</text>
        <text x="1100" y="353">DATA</text>
      </g>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="64" y="48" width="257" height="30" rx="15" fill="#451126" stroke="#C77B9B" stroke-opacity=".3"/>
      <text x="81" y="68" fill="#E5B5C7" font-size="12" letter-spacing="2">INTEGRATION / LEADERSHIP</text>
      <text x="60" y="156" fill="#F8F0F3" font-size="58" font-weight="700" letter-spacing="-1">Niranjan Kumar</text>
      <text x="60" y="220" fill="#F8F0F3" font-size="58" font-weight="700" letter-spacing="-1">Potter</text>
      <path d="M64 247H590" stroke="url(#hero-accent)" stroke-width="2" opacity=".7"/>
      <path class="hero-sheen" d="M64 247H134" stroke="#F8F0F3" stroke-width="5" filter="url(#hero-glow)"/>
      <text x="64" y="294" fill="#E5B5C7" font-size="23">Senior MuleSoft Developer / Technical Lead</text>
      <text x="64" y="334" fill="#F8F0F3" font-size="18">Connecting enterprise systems.</text>
      <text x="64" y="362" fill="#E5B5C7" font-size="18">Leading delivery. Enabling teams.</text>
      <text x="64" y="461" fill="#E5B5C7" font-size="14" letter-spacing="2">MULE 4 / DATAWEAVE / CLOUDHUB 2.0 / AWS</text>
      <text x="1136" y="461" text-anchor="end" fill="#E5B5C7" font-size="13" letter-spacing="2">NIRANJANPOTTER</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#C77B9B" stroke-opacity=".35"/>
</svg>
